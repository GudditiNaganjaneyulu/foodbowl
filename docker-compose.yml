services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api
    env_file:
      - ./.env
    restart: unless-stopped

    # Keep API private.
    # Nginx is the only public entry point.
    ports:
      - "127.0.0.1:4000:4000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: web

    # Nginx accesses web through the Docker network,
    # so this does not need to be publicly exposed.
    expose:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_SOCKET_URL: /socket

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - app-network

  # nginx:
  #   build:
  #     context: .
  #     dockerfile: apps/nginx/Dockerfile
  #   container_name: nginx

  #   ports:
  #     - "80:80"

  #   depends_on:
  #     - web
  #     - api

  #   restart: unless-stopped

  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge