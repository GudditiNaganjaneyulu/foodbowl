services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: api
    env_file:
      - ./.env
    restart: unless-stopped

    ports:
      - "4000:4000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:4000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* are inlined into the browser bundle at build time, so they
      # must be build args (a runtime `environment:` value is ignored). They must
      # be the address the *browser* uses to reach the API, e.g. http://<vm-ip>:4000.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:4000}
    container_name: web

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - app-network

networks:
  app-network:
    driver: bridge