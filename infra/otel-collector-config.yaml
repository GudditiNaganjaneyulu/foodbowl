receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  # Local, free trace viewing. Swap/add exporters here later to point at a
  # real backend (Honeycomb, Datadog, Tempo, …) — app code never changes.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      # Jaeger is traces-only, so metrics only go to the collector's own logs
      # for now (`docker logs <otel-collector container>`). Add a `prometheus`
      # exporter here (collector-contrib image) to scrape them from a real
      # metrics backend instead — app code (lib/tracing.ts) never changes.
      exporters: [debug]
